# ============================================================
# CyberDash — Docker Container Pipeline for Azure Web App
# ============================================================
# 5-Stage DevSecOps Pipeline:
# 1. Critical Functional & Integration Testing
# 2. Build & Push Hardened Docker Container to ACR
# 3. SAST (Semgrep) & Container Vulnerability Scanning (Trivy)
# 4. Deploy to Azure Web App for Containers (Persistent Storage)
# 5. DAST (OWASP ZAP) Security Verification Scan
# ============================================================

trigger:
- main

variables:
  # Azure Resource Manager & Container Registry Service Connections
  azureServiceConnectionId: '21873dc2-9960-450e-8684-dbd380230f52' # Azure Resource Manager (AzureRM) service connection
  acrServiceConnection: 'Cyberdash-registry-conn' # Docker Registry service connection for ACR

  # Container Registry & Image configuration
  containerRegistry: 'cyberdashregistry.azurecr.io' # Replace with your ACR login server
  imageRepository: 'cyberdash'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

  # Azure Web App target configuration
  webAppName: 'cyberdash-dev'
  environmentName: 'cyberdash-dev'
  vmImageName: 'ubuntu-latest'
  projectRoot: $(System.DefaultWorkingDirectory)

stages:
# ============================================================
# STAGE 1: CRITICAL FUNCTIONAL & INTEGRATION TESTS
# ============================================================
- stage: Test
  displayName: 'Run Critical Function Tests'
  jobs:
  - job: CriticalTestsJob
    displayName: 'Execute Critical App Test Suite'
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: UsePythonVersion@0
      displayName: 'Set Python 3.11 Environment'
      inputs:
        versionSpec: '3.11'
        addToPath: true

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      displayName: 'Install Dependencies'

    - script: |
        PYTHONPATH=. python scratch/test_critical_suite.py
      displayName: 'Run Critical Function & Integration Test Suite'

# ============================================================
# STAGE 2: BUILD & PUSH DOCKER CONTAINER
# ============================================================
- stage: BuildAndPush
  displayName: 'Build & Push Container'
  dependsOn: Test
  condition: succeeded()
  jobs:
  - job: DockerBuildJob
    displayName: 'Build & Push to ACR'
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: 'Build Docker image'
      inputs:
        command: build
        containerRegistry: $(acrServiceConnection)
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        tags: |
          $(tag)
          latest

    - task: Docker@2
      displayName: 'Push Docker image to ACR'
      inputs:
        command: push
        containerRegistry: $(acrServiceConnection)
        repository: $(imageRepository)
        tags: |
          $(tag)
          latest

# ============================================================
# STAGE 3: SECURITY SCANS (SAST & CONTAINER VULNERABILITY SCAN)
# ============================================================
- stage: SecurityScans
  displayName: 'Security Scans (SAST & Container Image)'
  dependsOn: BuildAndPush
  condition: succeeded()
  jobs:
  - job: ScansJob
    displayName: 'SAST & Container Vulnerability Scans'
    pool:
      vmImage: $(vmImageName)
    steps:
    # 1. Semgrep SAST Scan (Source Code Analysis)
    - script: |
        mkdir -p $(Build.ArtifactStagingDirectory)/semgrep
        docker run --rm \
          -v $(projectRoot):/src \
          -v $(Build.ArtifactStagingDirectory)/semgrep:/output \
          semgrep/semgrep semgrep scan \
          --config=auto \
          --json \
          -o /output/semgrep-report.json \
          /src
      displayName: 'Run Semgrep SAST Scan'
      continueOnError: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Semgrep SAST Report'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/semgrep/semgrep-report.json'
        ArtifactName: 'Semgrep_SAST_Report'
        publishLocation: 'Container'

    # 2. Log in to ACR and pull image for Trivy scan
    - task: Docker@2
      displayName: 'Log in to ACR for Trivy'
      inputs:
        command: login
        containerRegistry: $(acrServiceConnection)

    - script: |
        docker pull $(containerRegistry)/$(imageRepository):$(tag)
      displayName: 'Pull Container Image from ACR'

    # 3. Trivy Container Image Scan (Vulnerabilities, Secrets, Misconfigurations)
    - script: |
        mkdir -p $(Build.ArtifactStagingDirectory)/trivy
        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v $(Build.ArtifactStagingDirectory)/trivy:/output \
          aquasec/trivy:latest image \
          --scanners vuln,secret,config \
          --ignore-unfixed \
          --format template --template "@contrib/html.tpl" \
          -o /output/trivy-image-report.html \
          $(containerRegistry)/$(imageRepository):$(tag)
      displayName: 'Run Trivy Container Image Scan'
      continueOnError: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Trivy Container Report'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/trivy/trivy-image-report.html'
        ArtifactName: 'Trivy_Container_Report'
        publishLocation: 'Container'

# ============================================================
# STAGE 4: DEPLOY CONTAINER TO AZURE WEB APP
# ============================================================
- stage: Deploy
  displayName: 'Deploy Container to Azure'
  dependsOn: SecurityScans
  condition: succeeded()
  jobs:
  - deployment: DeploymentJob
    pool:
      vmImage: $(vmImageName)
    environment: $(environmentName)
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@2
            displayName: 'Configure and Deploy Container to Web App'
            inputs:
              azureSubscription: $(azureServiceConnectionId)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Fetching resource group for $(webAppName)..."
                RG_NAME=$(az webapp list --query "[?name=='$(webAppName)'].resourceGroup" -o tsv)
                echo "Found Resource Group: $RG_NAME"

                echo "Fetching ACR credentials for cyberdashregistry..."
                ACR_PASS=$(az acr credential show --name cyberdashregistry --query "passwords[0].value" -o tsv)

                echo "Configuring container image and registry credentials on $(webAppName)..."
                az webapp config container set \
                  --name $(webAppName) \
                  --resource-group "$RG_NAME" \
                  --container-image-name $(containerRegistry)/$(imageRepository):$(tag) \
                  --container-registry-url https://$(containerRegistry) \
                  --container-registry-user cyberdashregistry \
                  --container-registry-password "$ACR_PASS"

                echo "Setting application environment variables (Enabling Persistent Storage)..."
                az webapp config appsettings set \
                  --name $(webAppName) \
                  --resource-group "$RG_NAME" \
                  --settings \
                    WEBSITES_PORT=8000 \
                    WEBSITES_ENABLE_APP_SERVICE_STORAGE=true \
                    DATABASE_PATH="/home/data/cyber_dashboard.db" \
                    WEBSITES_CONTAINER_START_TIME_LIMIT=1800

                echo "Restarting Web App $(webAppName)..."
                az webapp restart --name $(webAppName) --resource-group "$RG_NAME"

# ============================================================
# STAGE 5: DAST (DYNAMIC APPLICATION SECURITY TESTING)
# ============================================================
- stage: DAST
  displayName: 'DAST Security Scan (OWASP ZAP)'
  dependsOn: Deploy
  condition: succeeded()
  jobs:
  - job: ZapScanJob
    pool:
      vmImage: $(vmImageName)
    steps:
    - script: |
        mkdir -p $(Build.ArtifactStagingDirectory)/zap
        sudo chmod -R 777 $(Build.ArtifactStagingDirectory)/zap

        echo "Warming up Web App at $WEB_APP_URL..."
        for i in {1..12}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$WEB_APP_URL" || echo "000")
            echo "Attempt $i: Received HTTP $HTTP_STATUS from $WEB_APP_URL"
            if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 302 ]; then
                echo "Web App is active and responding!"
                break
            fi
            echo "Waiting 10 seconds for Web App startup..."
            sleep 10
        done

        docker run --rm -v $(Build.ArtifactStagingDirectory)/zap:/zap/wrk/:rw -u root -t ghcr.io/zaproxy/zaproxy:stable \
          zap-baseline.py \
          -t "$WEB_APP_URL" \
          -r zap_dast_report.html \
          -J zap_out.json \
          -I \
          -z "-config connection.timeoutInSecs=60"
      env:
        WEB_APP_URL: $(webAppUrlSec)
      displayName: 'Run OWASP ZAP DAST Scan'
      continueOnError: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish OWASP ZAP DAST Report'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/zap/zap_dast_report.html'
        ArtifactName: 'OWASP_ZAP_DAST_Report'
        publishLocation: 'Container'
