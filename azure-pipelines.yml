# Python to Linux Web App on Azure
# Build your Python project and deploy it to Azure as a Linux Web App.
# Change python version to one thats appropriate for your application.
# https://docs.microsoft.com/azure/devops/pipelines/languages/python

trigger:
- main

variables:
  # Azure Resource Manager connection created during pipeline creation
  azureServiceConnectionId: '21873dc2-9960-450e-8684-dbd380230f52'

  # Web app name
  webAppName: 'cyberdash-dev'

  # Agent VM image name
  vmImageName: 'ubuntu-latest'

  # Environment name
  environmentName: 'cyberdash-dev'

  # Project root folder. Point to the application root directory.
  projectRoot: $(System.DefaultWorkingDirectory)

  pythonVersion: '3.11'

stages:
- stage: Build
  displayName: Build stage
  jobs:
  - job: BuildJob
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'
      displayName: 'Use Python $(pythonVersion)'

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      workingDirectory: $(projectRoot)
      displayName: "Install requirements & validate build"

# Security Scans
    - script: |
        # Download and install Horusec CLI
        curl -fsSL https://raw.githubusercontent.com/ZupIT/horusec/main/deployments/scripts/install.sh | bash -s latest
        
        # Run Horusec SAST scan on project directory
        horusec start -p="$(projectRoot)" -e="true" -o="json" -O="$(Build.ArtifactStagingDirectory)/horusec-report.json"
      displayName: 'Run Horusec SAST Security Scan'
      continueOnError: true # Set to true if you don't want security vulnerabilities to block deployment

# Create archive for deployment
    - task: ArchiveFiles@2
      displayName: 'Archive files'
      inputs:
        rootFolderOrFile: '$(projectRoot)'
        includeRootFolder: false
        archiveType: zip
        archiveFile: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
        replaceExistingArchive: true

    - upload: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
      displayName: 'Upload package'
      artifact: drop

- stage: Deploy
  displayName: 'Deploy Web App'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeploymentJob
    pool:
      vmImage: $(vmImageName)
    environment: $(environmentName)
    strategy:
      runOnce:
        deploy:
          steps:

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: 'Use Python version'

          - task: AzureWebApp@1
            displayName: 'Deploy Azure Web App : cyberdash-dev'
            inputs:
              azureSubscription: $(azureServiceConnectionId)
              appName: $(webAppName)
              package: $(Pipeline.Workspace)/drop/$(Build.BuildId).zip
              appSettings: '-DATABASE_PATH "/home/data/cyber_dashboard.db" -SCM_DO_BUILD_DURING_DEPLOYMENT true -WEBSITES_PORT 8000'
              startupCommand: 'gunicorn -w 2 -k uvicorn.workers.UvicornWorker --bind=0.0.0.0:8000 app.main:app'

- stage: DAST
  displayName: 'DAST Security Scan (OWASP ZAP)'
  dependsOn: Deploy
  condition: succeeded()
  jobs:
  - job: ZapScanJob
    pool:
      vmImage: $(vmImageName)
    steps:
    - script: |
        # Ensure report staging directory exists
        mkdir -p $(Build.ArtifactStagingDirectory)/zap

        # Pull and run OWASP ZAP Baseline Scan against the deployed Web App
        docker run --rm -v $(Build.ArtifactStagingDirectory)/zap:/zap/wrk/:rw -t ghcr.io/zaproxy/zaproxy:stable \
          zap-baseline.py \
          -t $env:webAppUrl \
          -r zap_dast_report.html \
          -I
      env:
        webAppUrl: $(webAppUrlSec)
      displayName: 'Run OWASP ZAP DAST Scan'
      continueOnError: true # Set to false if you want DAST vulnerabilities to block pipeline completion

    # Publish the HTML report as an Azure DevOps Pipeline Artifact
    - task: PublishBuildArtifacts@1
      displayName: 'Publish OWASP ZAP DAST Report'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/zap/zap_dast_report.html'
        ArtifactName: 'OWASP_ZAP_DAST_Report'
        publishLocation: 'Container'
