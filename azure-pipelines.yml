# ============================================================
# CyberDash — Automated DevSecOps Pipeline (Docker Hub & Azure Free Tier)
# ============================================================
# Stage 1 (BuildTestAndSecurity):
#   - Critical Function & Integration Testing (sandbox SQLite DB)
#   - SonarCloud SAST Quality Gate & Test Coverage
#   - Snyk Open Source SCA Dependency Vulnerability Scan
#   - Decoupled Container Build & Push to Docker Hub (maarne/cyberdash)
#   - Semgrep Static Application Security Testing (SAST)
#   - Trivy & Snyk Container Image Vulnerability Scanning
#   - Zero-Cost Shift-Left DAST (OWASP ZAP on Agent-Local Container)
#
# Stage 2 (ProductionDeployment):
#   - Automated Continuous Deployment (Triggered on all tests & scans passing)
#   - Provision / Ensure Production Infrastructure via Bicep (Free Tier F1)
#   - Deploy Verified Docker Hub Container Image to Azure Web App
#   - Automated Cold-Start Health Probe & Dynamic Smoke Test
# ============================================================

trigger:
  branches:
    include:
    - main
    - feature
    - feature/*

variables:
  # Azure Resource Manager & Docker Hub Service Connections
  azureServiceConnectionId: '21873dc2-9960-450e-8684-dbd380230f52'
  dockerRegistryServiceConnection: 'dockerhub-conn'

  # Container Registry & Image configuration (Docker Hub)
  dockerHubUsername: 'maarne'
  imageRepository: 'maarne/cyberdash'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

  # Target Environment & Pipeline Agent
  environmentName: 'cyberdash-prod'
  vmImageName: 'ubuntu-latest'
  projectRoot: $(System.DefaultWorkingDirectory)

stages:
# ============================================================
# STAGE 1: BUILD, TEST, SCA, SAST & ZERO-COST DAST
# ============================================================
- stage: BuildTestAndSecurity
  displayName: 'Stage 1: Build, Test & Security Scans'
  jobs:
  # ------------------------------------------------------------
  # Job 1: Critical Function & Integration Testing + SonarCloud + Snyk SCA
  # ------------------------------------------------------------
  - job: CriticalTestsJob
    displayName: 'Critical Function & Integration Tests'
    pool:
      vmImage: $(vmImageName)
    steps:
    - checkout: self
      fetchDepth: 0

    # 1. Prepare SonarQube Analysis
    - task: SonarCloudPrepare@4
      displayName: 'Prepare SonarQube Analysis'
      inputs:
        SonarQube: 'sonarqubecloud'
        organization: 'maarne'
        scannerMode: 'cli'
        configMode: 'manual'
        cliProjectKey: 'maarne_LearningDevOps'
        cliProjectName: 'LearningDevOps'
        cliSources: 'app'
        extraProperties: |
          sonar.python.version=3.11
          sonar.python.coverage.reportPaths=$(System.DefaultWorkingDirectory)/coverage.xml
          sonar.exclusions=scratch/**,infra/**,images/**,static/vendor/**
          sonar.branch.name=$(Build.SourceBranchName)
          
    - task: UsePythonVersion@0
      displayName: 'Set Python 3.11 Environment'
      inputs:
        versionSpec: '3.11'
        addToPath: true

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install coverage
      displayName: 'Install Python Dependencies & Coverage Tools'

    - script: |
        PYTHONPATH=. python -m coverage run --source=app scratch/test_critical_suite.py
        python -m coverage xml -o $(System.DefaultWorkingDirectory)/coverage.xml
      displayName: 'Execute All-in-One Critical Test Suite with Coverage'

    # Snyk Open Source Dependency Scan (SCA)
    - task: SnykSecurityScan@1
      displayName: 'Snyk Open Source Dependency Scan'
      inputs:
        serviceConnectionEndpoint: 'snyk-conn'
        testType: 'app'
        targetFile: 'requirements.txt'
        monitorWhen: 'always'
        failOnIssues: false
        projectName: 'LearningDevOps/LearningDevOps'
        organization: 'maarne'
        additionalArguments: '--command=python3'

    # Run Code Analysis (After test & coverage execution)
    - task: SonarCloudAnalyze@4
      displayName: 'Run SonarQube Code Analysis'

    # Publish Quality Gate
    - task: SonarCloudPublish@4
      displayName: 'Publish SonarQube Quality Gate'
      inputs:
        pollingTimeoutSec: '300'

  # ------------------------------------------------------------
  # Job 2: Decoupled Container Build & Push to Docker Hub
  # ------------------------------------------------------------
  - job: DockerBuildAndPushJob
    displayName: 'Build & Push Docker Hub Image'
    dependsOn: CriticalTestsJob
    condition: succeeded()
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: 'Build Docker image'
      inputs:
        command: build
        containerRegistry: $(dockerRegistryServiceConnection)
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        tags: |
          $(tag)
          latest

    - task: Docker@2
      displayName: 'Push Docker image to Docker Hub'
      inputs:
        command: push
        containerRegistry: $(dockerRegistryServiceConnection)
        repository: $(imageRepository)
        tags: |
          $(tag)
          latest

  # ------------------------------------------------------------
  # Job 3: SAST, Container Scanning & Shift-Left In-Pipeline DAST
  # ------------------------------------------------------------
  - job: SecurityScansJob
    displayName: 'SAST, Container Scanning & Zero-Cost DAST'
    dependsOn: DockerBuildAndPushJob
    condition: succeeded()
    pool:
      vmImage: $(vmImageName)
    steps:
    # Semgrep SAST Scan
    - script: |
        mkdir -p $(Build.ArtifactStagingDirectory)/semgrep
        docker run --rm \
          -v $(projectRoot):/src \
          -v $(Build.ArtifactStagingDirectory)/semgrep:/output \
          semgrep/semgrep semgrep scan \
          --config=auto \
          --json \
          -o /output/semgrep-report.json \
          /src
      displayName: 'Run Semgrep SAST Scan'
      continueOnError: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Semgrep SAST Report'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/semgrep/semgrep-report.json'
        ArtifactName: 'Semgrep_SAST_Report'
        publishLocation: 'Container'

    # Docker Hub Login & Image Pull for Security Tools
    - task: Docker@2
      displayName: 'Log in to Docker Hub'
      inputs:
        command: login
        containerRegistry: $(dockerRegistryServiceConnection)

    - script: |
        docker pull $(imageRepository):$(tag)
      displayName: 'Pull Built Image from Docker Hub'

    # Trivy Container Image Scan
    - script: |
        mkdir -p $(Build.ArtifactStagingDirectory)/trivy
        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v $(Build.ArtifactStagingDirectory)/trivy:/output \
          aquasec/trivy:latest image \
          --scanners vuln,secret,config \
          --ignore-unfixed \
          --format template --template "@contrib/html.tpl" \
          -o /output/trivy-image-report.html \
          $(imageRepository):$(tag)
      displayName: 'Run Trivy Container Image Scan'
      continueOnError: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Trivy Container Report'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/trivy/trivy-image-report.html'
        ArtifactName: 'Trivy_Container_Report'
        publishLocation: 'Container'

    # Snyk Container Image Security Scan
    - task: SnykSecurityScan@1
      displayName: 'Snyk Container Image Security Scan'
      inputs:
        serviceConnectionEndpoint: 'snyk-conn'
        testType: 'container'
        dockerImageName: '$(imageRepository):$(tag)'
        dockerfilePath: 'Dockerfile'
        monitorWhen: 'always'
        failOnIssues: false
        projectName: 'LearningDevOps/LearningDevOps'
        organization: 'maarne'

    # Shift-Left In-Pipeline Zero-Cost DAST (OWASP ZAP against local agent container)
    - script: |
        echo "Launching agent-local CyberDash container for DAST security analysis..."
        docker run -d --name local-cyberdash -p 8000:8000 $(imageRepository):$(tag)

        echo "Waiting for local container to become healthy..."
        for i in {1..15}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/health || echo "000")
            echo "Attempt $i: Received HTTP $HTTP_STATUS from local health probe"
            if [ "$HTTP_STATUS" -eq 200 ]; then
                echo "✅ Local container is responsive and healthy!"
                break
            fi
            sleep 2
        done

        mkdir -p $(Build.ArtifactStagingDirectory)/zap
        sudo chmod -R 777 $(Build.ArtifactStagingDirectory)/zap

        echo "Running OWASP ZAP DAST scan against http://localhost:8000..."
        docker run --rm --network="host" \
          -v $(Build.ArtifactStagingDirectory)/zap:/zap/wrk/:rw \
          -u root -t ghcr.io/zaproxy/zaproxy:stable \
          zap-baseline.py \
          -t "http://localhost:8000" \
          -r zap_dast_report.html \
          -J zap_out.json \
          -I \
          -z "-config connection.timeoutInSecs=60" || true

        echo "Cleaning up local CyberDash container..."
        docker stop local-cyberdash || true
        docker rm local-cyberdash || true
      displayName: 'Execute Zero-Cost Shift-Left DAST (OWASP ZAP)'
      continueOnError: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish OWASP ZAP DAST Report'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/zap/zap_dast_report.html'
        ArtifactName: 'OWASP_ZAP_DAST_Report'
        publishLocation: 'Container'

# ============================================================
# STAGE 2: AUTOMATED PRODUCTION DEPLOYMENT (FREE TIER F1)
# ============================================================
- stage: ProductionDeployment
  displayName: 'Stage 2: Production Deployment (Free Tier F1)'
  dependsOn: BuildTestAndSecurity
  condition: succeeded()
  jobs:
  - deployment: ProductionDeploymentJob
    displayName: 'Deploy to Azure App Service Free Tier (F1)'
    pool:
      vmImage: $(vmImageName)
    environment: $(environmentName)
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: AzureCLI@2
            displayName: 'Deploy Bicep Infrastructure (F1) & Update Docker Hub Image'
            inputs:
              azureSubscription: $(azureServiceConnectionId)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e

                echo "Discovering Azure Resource Group for Production..."
                RG_NAME=$(az webapp list --query "[?contains(name, 'cyberdash')].resourceGroup" -o tsv | head -n 1)
                if [ -z "$RG_NAME" ]; then
                    RG_NAME=$(az group list --query "[?contains(name, 'cyberdash') || contains(name, 'CyberDash')].name | [0]" -o tsv)
                fi
                if [ -z "$RG_NAME" ]; then
                    RG_NAME="cyberdash-rg"
                fi
                echo "Target Production Resource Group: $RG_NAME"

                echo "Deploying / Verifying Production Infrastructure via Bicep (Free Tier F1)..."
                DEPLOY_OUTPUT=$(az deployment group create \
                  --name "deploy-prod-$(Build.BuildId)" \
                  --resource-group "$RG_NAME" \
                  --template-file "$(Build.SourcesDirectory)/infra/main.bicep" \
                  --parameters \
                    environmentType=prod \
                    baseName=cyberdash \
                    skuName=F1 \
                    containerImage=$(imageRepository):$(tag) \
                    dockerRegistryServerUrl="https://index.docker.io/v1" \
                    enablePersistentStorage=false \
                  --query "properties.outputs" -o json)

                PROD_URL=$(echo "$DEPLOY_OUTPUT" | python3 -c "import sys, json; print(json.load(sys.stdin)['webAppUrl']['value'])")
                PROD_APP_NAME=$(echo "$DEPLOY_OUTPUT" | python3 -c "import sys, json; print(json.load(sys.stdin)['webAppName']['value'])")

                echo "============================================================"
                echo "🚀 Production Web App Deployed on Free Tier (F1):"
                echo "   App Name: $PROD_APP_NAME"
                echo "   URL:      $PROD_URL"
                echo "============================================================"

                echo "Configuring Web App container image and registry settings..."
                az webapp config container set \
                  --name "$PROD_APP_NAME" \
                  --resource-group "$RG_NAME" \
                  --docker-custom-image-name "$(imageRepository):$(tag)" \
                  --docker-registry-server-url "https://index.docker.io"

                echo "Applying Free Tier container settings (disabling SMB storage)..."
                az webapp config appsettings set \
                  --name "$PROD_APP_NAME" \
                  --resource-group "$RG_NAME" \
                  --settings WEBSITES_ENABLE_APP_SERVICE_STORAGE=false DATABASE_PATH="/app/data/cyber_dashboard.db" WEBSITES_PORT=8000

                echo "Restarting Production Web App $PROD_APP_NAME..."
                az webapp restart --name "$PROD_APP_NAME" --resource-group "$RG_NAME"

                echo "Running Production Cold-Start Smoke Test against $PROD_URL..."
                for i in {1..20}; do
                    HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_URL" || echo "000")
                    echo "Attempt $i: Received HTTP $HTTP_STATUS from $PROD_URL"
                    if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 302 ] || [ "$HTTP_STATUS" -eq 307 ]; then
                        echo "✅ Production Web App $PROD_APP_NAME is fully operational!"
                        break
                    fi
                    sleep 10
                done
