# ============================================================
# CyberDash — Docker Container Pipeline for Azure Web App
# ============================================================
# Builds and pushes a hardened Docker container to Azure Container Registry (ACR),
# runs SAST & Container Vulnerability Scans, deploys to Azure Web App for Containers,
# and verifies security with OWASP ZAP DAST testing.

trigger:
- main

variables:
  # Azure Resource Manager & Container Registry Service Connections
  azureServiceConnectionId: 'f65a0d7f-7fa4-4312-a946-ecc64a7d70bf'
  acrServiceConnection: 'Cyberdash-registry-conn' # Update to match your Azure DevOps ACR Service Connection name

  # Container Registry & Image configuration
  containerRegistry: 'cyberdashregistry.azurecr.io' # Replace with your ACR login server
  imageRepository: 'cyberdash'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

  # Azure Web App target configuration
  webAppName: 'cyberdash-dev'
  environmentName: 'cyberdash-dev'
  vmImageName: 'ubuntu-latest'
  projectRoot: $(System.DefaultWorkingDirectory)

stages:
# ============================================================
# STAGE 1: BUILD & PUSH DOCKER CONTAINER
# ============================================================
- stage: BuildAndPush
  displayName: 'Build & Push Container'
  jobs:
  - job: DockerBuildJob
    displayName: 'Build & Push to ACR'
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: 'Build and Push Docker image to ACR'
      inputs:
        command: buildAndPush
        containerRegistry: $(acrServiceConnection)
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        tags: |
          $(tag)
          latest

# ============================================================
# STAGE 2: SECURITY SCANS (SAST & CONTAINER VULNERABILITY SCAN)
# ============================================================
- stage: SecurityScans
  displayName: 'Security Scans (SAST & Container Image)'
  dependsOn: BuildAndPush
  condition: succeeded()
  jobs:
  - job: ScansJob
    displayName: 'SAST & Container Vulnerability Scans'
    pool:
      vmImage: $(vmImageName)
    steps:
    # 1. Semgrep SAST Scan (Source Code Analysis)
    - script: |
        mkdir -p $(Build.ArtifactStagingDirectory)/semgrep
        docker run --rm \
          -v $(projectRoot):/src \
          -v $(Build.ArtifactStagingDirectory)/semgrep:/output \
          semgrep/semgrep semgrep scan \
          --config=auto \
          --json \
          -o /output/semgrep-report.json \
          /src
      displayName: 'Run Semgrep SAST Scan'
      continueOnError: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Semgrep SAST Report'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/semgrep/semgrep-report.json'
        ArtifactName: 'Semgrep_SAST_Report'
        publishLocation: 'Container'

    # 2. Trivy Container Image Scan (Vulnerabilities, Secrets, Misconfigurations)
    - script: |
        mkdir -p $(Build.ArtifactStagingDirectory)/trivy
        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v $(Build.ArtifactStagingDirectory)/trivy:/output \
          aquasec/trivy:latest image \
          --scanners vuln,secret,config \
          --format template --template "@contrib/html.tpl" \
          -o /output/trivy-image-report.html \
          $(containerRegistry)/$(imageRepository):$(tag)
      displayName: 'Run Trivy Container Image Scan'
      continueOnError: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Trivy Container Report'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/trivy/trivy-image-report.html'
        ArtifactName: 'Trivy_Container_Report'
        publishLocation: 'Container'

# ============================================================
# STAGE 3: DEPLOY CONTAINER TO AZURE WEB APP
# ============================================================
- stage: Deploy
  displayName: 'Deploy Container to Azure'
  dependsOn: SecurityScans
  condition: succeeded()
  jobs:
  - deployment: DeploymentJob
    pool:
      vmImage: $(vmImageName)
    environment: $(environmentName)
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebAppContainer@1
            displayName: 'Deploy Azure Web App for Containers'
            inputs:
              azureSubscription: $(azureServiceConnectionId)
              appName: $(webAppName)
              containers: $(containerRegistry)/$(imageRepository):$(tag)
              appSettings: '-WEBSITES_PORT 8000 -DATABASE_PATH "/app/data/cyber_dashboard.db"'

# ============================================================
# STAGE 4: DAST (DYNAMIC APPLICATION SECURITY TESTING)
# ============================================================
- stage: DAST
  displayName: 'DAST Security Scan (OWASP ZAP)'
  dependsOn: Deploy
  condition: succeeded()
  jobs:
  - job: ZapScanJob
    pool:
      vmImage: $(vmImageName)
    steps:
    - script: |
        mkdir -p $(Build.ArtifactStagingDirectory)/zap
        sudo chmod -R 777 $(Build.ArtifactStagingDirectory)/zap

        echo "Warming up Web App at $WEB_APP_URL..."
        for i in {1..12}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$WEB_APP_URL" || echo "000")
            echo "Attempt $i: Received HTTP $HTTP_STATUS from $WEB_APP_URL"
            if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 302 ]; then
                echo "Web App is active and responding!"
                break
            fi
            echo "Waiting 10 seconds for Web App startup..."
            sleep 10
        done

        docker run --rm -v $(Build.ArtifactStagingDirectory)/zap:/zap/wrk/:rw -u root -t ghcr.io/zaproxy/zaproxy:stable \
          zap-baseline.py \
          -t "$WEB_APP_URL" \
          -r zap_dast_report.html \
          -J zap_out.json \
          -I \
          -z "-config connection.timeoutInSecs=60"
      env:
        WEB_APP_URL: $(webAppUrlSec)
      displayName: 'Run OWASP ZAP DAST Scan'
      continueOnError: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish OWASP ZAP DAST Report'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/zap/zap_dast_report.html'
        ArtifactName: 'OWASP_ZAP_DAST_Report'
        publishLocation: 'Container'
