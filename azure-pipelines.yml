# Python to Linux Web App on Azure
# Build your Python project and deploy it to Azure as a Linux Web App.
# https://docs.microsoft.com/azure/devops/pipelines/languages/python

trigger:
- main

variables:
  # Azure Resource Manager connection created during pipeline creation
  azureServiceConnectionId: '21873dc2-9960-450e-8684-dbd380230f52'

  # Web app name
  webAppName: 'cyberdash-dev'

  # Agent VM image name
  vmImageName: 'ubuntu-latest'

  # Environment name
  environmentName: 'cyberdash-dev'

  # Project root folder. Point to the application root directory.
  projectRoot: $(System.DefaultWorkingDirectory)

  pythonVersion: '3.11'

stages:
# ============================================================
# STAGE 1: BUILD
# ============================================================
- stage: Build
  displayName: Build stage
  jobs:
  - job: BuildJob
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'
      displayName: 'Use Python $(pythonVersion)'

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      workingDirectory: $(projectRoot)
      displayName: "Install requirements & validate build"

    - task: ArchiveFiles@2
      displayName: 'Archive files'
      inputs:
        rootFolderOrFile: '$(projectRoot)'
        includeRootFolder: false
        archiveType: zip
        archiveFile: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
        replaceExistingArchive: true

    - upload: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
      displayName: 'Upload package'
      artifact: drop

# ============================================================
# STAGE 2: SECURITY SCANS (SAST & SCA)
# ============================================================
- stage: SecurityScans
  displayName: 'Security Scans (SAST & SCA)'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: SAST_SCA_Job
    displayName: 'SAST & SCA Vulnerability Scans'
    pool:
      vmImage: $(vmImageName)
    steps:
    # 1. Semgrep SAST Scan (Code Security Analysis)
    - script: |
        mkdir -p $(Build.ArtifactStagingDirectory)/semgrep
        docker run --rm \
          -v $(projectRoot):/src \
          -v $(Build.ArtifactStagingDirectory)/semgrep:/output \
          semgrep/semgrep semgrep scan \
          --config=auto \
          --json \
          -o /output/semgrep-report.json \
          /src
      displayName: 'Run Semgrep SAST Scan'
      continueOnError: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Semgrep SAST Report'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/semgrep/semgrep-report.json'
        ArtifactName: 'Semgrep_SAST_Report'
        publishLocation: 'Container'

    # 2. Trivy Security Scan (SCA, Secrets & Configs)
    - script: |
        mkdir -p $(Build.ArtifactStagingDirectory)/trivy
        docker run --rm \
          -v $(projectRoot):/src \
          -v $(Build.ArtifactStagingDirectory)/trivy:/output \
          aquasec/trivy:latest fs \
          --scanners config,vuln,secret \
          --format template --template "@contrib/html.tpl" \
          -o /output/trivy-report.html \
          /src
      displayName: 'Run Trivy Security Scan'
      continueOnError: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Trivy Security Report'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/trivy/trivy-report.html'
        ArtifactName: 'Trivy_Security_Report'
        publishLocation: 'Container'

# ============================================================
# STAGE 3: DEPLOYMENT
# ============================================================
- stage: Deploy
  displayName: 'Deploy Web App'
  dependsOn: SecurityScans
  condition: succeeded()
  jobs:
  - deployment: DeploymentJob
    pool:
      vmImage: $(vmImageName)
    environment: $(environmentName)
    strategy:
      runOnce:
        deploy:
          steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: 'Use Python version'

          - task: AzureWebApp@1
            displayName: 'Deploy Azure Web App : cyberdash-dev'
            inputs:
              azureSubscription: $(azureServiceConnectionId)
              appName: $(webAppName)
              package: $(Pipeline.Workspace)/drop/$(Build.BuildId).zip
              appSettings: '-DATABASE_PATH "/home/data/cyber_dashboard.db" -SCM_DO_BUILD_DURING_DEPLOYMENT true -WEBSITES_PORT 8000'
              startupCommand: 'gunicorn -w 2 -k uvicorn.workers.UvicornWorker --bind=0.0.0.0:8000 app.main:app'

# ============================================================
# STAGE 4: DAST (DYNAMIC APPLICATION SECURITY TESTING)
# ============================================================
- stage: DAST
  displayName: 'DAST Security Scan (OWASP ZAP)'
  dependsOn: Deploy
  condition: succeeded()
  jobs:
  - job: ZapScanJob
    pool:
      vmImage: $(vmImageName)
    steps:
    - script: |
        # Ensure report staging directory exists with write permissions
        mkdir -p $(Build.ArtifactStagingDirectory)/zap
        sudo chmod -R 777 $(Build.ArtifactStagingDirectory)/zap

        # Warm up Azure Web App and wait until it is ready
        echo "Warming up Web App at $WEB_APP_URL..."
        for i in {1..12}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$WEB_APP_URL" || echo "000")
            echo "Attempt $i: Received HTTP $HTTP_STATUS from $WEB_APP_URL"
            if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 302 ]; then
                echo "Web App is active and responding!"
                break
            fi
            echo "Waiting 10 seconds for Web App startup..."
            sleep 10
        done

        # Pull and run OWASP ZAP Baseline Scan as root container user
        docker run --rm -v $(Build.ArtifactStagingDirectory)/zap:/zap/wrk/:rw -u root -t ghcr.io/zaproxy/zaproxy:stable \
          zap-baseline.py \
          -t "$WEB_APP_URL" \
          -r zap_dast_report.html \
          -J zap_out.json \
          -I \
          -z "-config connection.timeoutInSecs=60"
      env:
        WEB_APP_URL: $(webAppUrlSec)
      displayName: 'Run OWASP ZAP DAST Scan'
      continueOnError: true

    # Publish the HTML report as an Azure DevOps Pipeline Artifact
    - task: PublishBuildArtifacts@1
      displayName: 'Publish OWASP ZAP DAST Report'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/zap/zap_dast_report.html'
        ArtifactName: 'OWASP_ZAP_DAST_Report'
        publishLocation: 'Container'
